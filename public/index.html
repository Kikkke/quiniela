<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela Mundialista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Quiniela Mundialista :) </h1>
            <p id="estado-conexion" class="desconectado">Conectando al servidor...</p>
            <button id="btn-actualizar" class="btn-refresh">
                <span id="icono-refresh"></span> Actualizar Resultados
            </button>
        </header>

        <section class="seccion-tabla">
            <h2>📈 Tabla de Posiciones</h2>
            <table id="tabla-posiciones">
                <thead>
                    <tr>
                        <th>Posición</th>
                        <th>Participante</th>
                        <th>Puntos Totales</th>
                    </tr>
                </thead>
                <tbody id="body-posiciones">
                    </tbody>
            </table>
        </section>

        <section class="seccion-tabla">
            <h2>Estado de los Equipos</h2>
            <table id="tabla-equipos">
                <thead>
                    <tr>
                        <th>Participante</th>
                        <th>Equipos (Vivos y Eliminados)</th>
                    </tr>
                </thead>
                <tbody id="body-equipos">
                    </tbody>
            </table>
        </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    
    <script src="back.js"></script>
</body>
</html>
